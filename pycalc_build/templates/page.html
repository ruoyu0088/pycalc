<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20252e">
<link rel="manifest" href="./manifest.json">
<title>PyCalc</title>
<style>
__PYCALC_CSS__
</style>
<style>
__PYCALC_KEYBOARD_CSS__
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <button id="session-title" class="session-title" data-i18n-title="session.switchTitle"
              aria-haspopup="menu" aria-expanded="false">
        <span id="session-title-name" class="session-title-name"></span>
        <span class="session-title-caret" aria-hidden="true">▾</span>
      </button>
    </div>

    <div class="session-bar">
      <span class="session-label" data-i18n="session.label"></span>
      <select id="session-select" data-i18n-title="session.selectTitle"></select>
      <button id="session-new" class="icon-btn" data-i18n-title="session.new">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button id="session-rename" class="icon-btn" data-i18n-title="session.rename">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"></path><path d="m13.5 6.5 3 3"></path></svg>
      </button>
      <button id="session-redraw" class="icon-btn" data-i18n-title="session.redraw">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
      </button>
      <button id="session-sweep" class="icon-btn" data-i18n-title="session.clear">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7"></path><path d="m13 4 7 7-8 8-7-7 8-8Z"></path><path d="m5 12-2 9 9-2"></path></svg>
      </button>
      <button id="session-delete" class="icon-btn danger" data-i18n-title="session.delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>

    <div class="top-actions">
      <label class="select-label">
        <!-- <span data-i18n="language.label"></span> -->
        <select id="language-select" class="compact-select">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <button id="session-bar-toggle" class="icon-btn mobile-only" data-i18n-title="session.hideBar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"></path></svg>
      </button>
      <button id="display-settings" class="icon-btn" data-i18n-title="display.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" data-i18n-title="theme.toggleTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      </button>
      <button id="sidebar-toggle" class="icon-btn" data-i18n-title="sidebar.toggleTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <span id="save-status" class="save-status"></span>
    </div>
  </header>

  <div id="session-menu" class="session-menu hidden" role="menu"></div>
  <div id="runtime-status" class="runtime-status hidden" role="status" aria-live="polite"></div>

  <div id="display-dialog" class="display-dialog hidden">
    <div class="display-backdrop" id="display-backdrop"></div>
    <section class="display-panel" role="dialog" aria-modal="true" aria-labelledby="display-title">
      <header class="display-header">
        <h2 id="display-title" data-i18n="display.title"></h2>
        <button id="display-close" class="icon-btn" data-i18n-title="display.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div class="display-body">
        <fieldset class="display-group">
          <legend data-i18n="display.sympy"></legend>
          <div class="display-options">
            <label><input type="radio" name="sympy-output" value="text"> <span data-i18n="display.sympyText"></span></label>
            <label><input type="radio" name="sympy-output" value="math"> <span data-i18n="display.sympyMath"></span></label>
            <label><input type="radio" name="sympy-output" value="all"> <span data-i18n="display.sympyAll"></span></label>
          </div>
        </fieldset>
        <fieldset class="display-group">
          <legend data-i18n="display.numpy"></legend>
          <div class="display-options">
            <label><input type="radio" name="numpy-output" value="default"> <span data-i18n="display.numpyDefault"></span></label>
            <label><input type="radio" name="numpy-output" value="pretty"> <span data-i18n="display.numpyPretty"></span></label>
            <label><input type="radio" name="numpy-output" value="table"> <span data-i18n="display.numpyTable"></span></label>
          </div>
        </fieldset>
        <label class="display-row">
          <span data-i18n="display.floatPrecision"></span>
          <select id="display-float-digits" class="compact-select">
            <option value="auto" data-i18n="display.auto">Auto</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="15">15</option>
          </select>
        </label>
        <div class="display-row display-limits">
          <label><span data-i18n="display.maxTabs"></span>
            <select id="display-numpy-tabs" class="compact-select">
              <option value="2">2</option><option value="5">5</option>
              <option value="8">8</option><option value="10">10</option>
            </select>
          </label>
          <label><span data-i18n="display.maxRows"></span>
            <select id="display-numpy-rows" class="compact-select">
              <option value="10">10</option><option value="20">20</option>
              <option value="50">50</option><option value="100">100</option>
            </select>
          </label>
          <label><span data-i18n="display.maxColumns"></span>
            <select id="display-numpy-cols" class="compact-select">
              <option value="5">5</option><option value="10">10</option>
              <option value="20">20</option><option value="50">50</option>
            </select>
          </label>
        </div>
        <fieldset class="display-group">
          <legend data-i18n="display.dataframe"></legend>
          <div class="display-options">
            <label><input type="radio" name="dataframe-output" value="text"> <span data-i18n="display.dataframeText"></span></label>
            <label><input type="radio" name="dataframe-output" value="table"> <span data-i18n="display.dataframeTable"></span></label>
          </div>
        </fieldset>
        <div class="display-row display-limits">
          <label><span data-i18n="display.maxRows"></span>
            <select id="display-dataframe-rows" class="compact-select">
              <option value="10">10</option><option value="20">20</option>
              <option value="50">50</option><option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
          <label><span data-i18n="display.maxColumns"></span>
            <select id="display-dataframe-cols" class="compact-select">
              <option value="5">5</option><option value="10">10</option>
              <option value="20">20</option><option value="50">50</option>
            </select>
          </label>
        </div>
        <fieldset class="display-group">
          <legend data-i18n="display.matplotlib"></legend>
          <label class="display-check">
            <input id="display-hide-plot" type="checkbox">
            <span data-i18n="display.hidePlotResult"></span>
          </label>
        </fieldset>
      </div>
    </section>
  </div>

  <div class="workspace" id="workspace">
    <aside id="sidebar" class="sidebar">
      <section class="side-card">
        <h3 data-i18n="sidebar.variables"></h3>
        <div class="table-wrap">
          <table class="side-table">
            <thead>
              <tr>
                <th data-i18n="table.name"></th>
                <th data-i18n="table.type"></th>
                <th data-i18n="table.value"></th>
              </tr>
            </thead>
            <tbody id="vars-body"></tbody>
          </table>
        </div>
        <div id="vars-empty" class="side-empty" data-i18n="sidebar.emptyVariables"></div>
      </section>

      <section class="side-card">
        <h3 data-i18n="sidebar.functions"></h3>
        <div class="table-wrap">
          <table class="side-table side-table-funcs">
            <thead>
              <tr>
                <th data-i18n="table.name"></th>
                <th data-i18n="table.params"></th>
              </tr>
            </thead>
            <tbody id="funcs-body"></tbody>
          </table>
        </div>
        <div id="funcs-empty" class="side-empty" data-i18n="sidebar.emptyFunctions"></div>
      </section>
    </aside>

    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" data-i18n-title="sidebar.resizeTitle"></div>

    <main class="main">
      <div id="console" class="console" aria-live="polite"></div>

      <section class="composer">
        <div class="library-bar">
          <!-- <span class="library-label" data-i18n="libraries.label"></span> -->
          <div id="library-list" class="library-list"></div>
          <span id="library-note" class="library-note" data-i18n="libraries.hint"></span>
          <div class="history-actions">
            <button id="history-undo" class="icon-btn history-btn" type="button"
                    data-i18n-title="history.undoTitle" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h9a7 7 0 0 1 7 7v1"></path></svg>
            </button>
            <button id="history-redo" class="icon-btn history-btn" type="button"
                    data-i18n-title="history.redoTitle" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9h-9a7 7 0 0 0-7 7v1"></path></svg>
            </button>
            <button id="editor-clear" class="icon-btn history-btn" type="button"
                    data-i18n-title="keyboard.key.clearInput">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 7-7 5 5-5 5H7l-3-3Z"></path><path d="m9 9 5 5M4 21h16"></path></svg>
            </button>
          </div>
        </div>

        <div class="editor-shell">
          <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
          <button id="run" class="run-btn editor-run-btn" data-i18n="run.button" disabled></button>
        </div>
      </section>
    </main>
  </div>

  <div id="banner" class="banner hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="overlay-title"></h2>
      <p id="overlay-detail"></p>
      <pre id="overlay-error" class="overlay-error hidden"></pre>
      <button id="overlay-retry" class="secondary hidden" data-i18n="overlay.retry"></button>
    </div>
  </div>
</div>

<script type="application/json" id="pycalc-config">__PYCALC_CONFIG__</script>
<script type="application/json" id="pycalc-assets">__PYCALC_ASSETS__</script>
<script type="application/json" id="pycalc-i18n">__PYCALC_I18N__</script>
<script type="text/python" id="pycalc-glue">__PYCALC_GLUE__</script>
__PYCALC_ASM__
<script type="text/plain" id="pycalc-pyodide-js">__PYCALC_PYODIDE_JS__</script>
<script type="text/plain" id="pycalc-runtime-worker">__PYCALC_WORKER_JS__</script>
__PYCALC_EDITOR_JS__
<script>__PYCALC_KEYBOARD_JS__</script>
<script>__PYCALC_APP_JS__</script>
<script>
(() => {
  const localhost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const swAllowed =
    location.protocol === 'https:' ||
    (location.protocol === 'http:' && localhost);
  if (!('serviceWorker' in navigator) || !swAllowed) return;
  window.addEventListener('load', () => {
    if (navigator.storage && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().catch(() => {});
    }
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('[PyCalc] Service Worker registration failed:', err);
    });
  });
})();
</script>
</body>
</html>
